<svg xmlns="http://www.w3.org/2000/svg" width="880" height="26" viewBox="0 0 880 26">
  
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .kick { font-size: 22px; font-weight: 600; fill: #BCEA44; letter-spacing: 3px; }
    .title { font-size: 40px; font-weight: 700; fill: #F4F1E9; }
    .grid { animation: pan 16s linear infinite; }
    @keyframes pan { from { transform: translate(0,0); } to { transform: translate(48px,48px); } }
    .shine { animation: sweep 5.5s ease-in-out infinite; opacity: 0; }
    @keyframes sweep { 0% { transform: translateX(-140px); opacity: 0; } 10% { opacity: .8; } 30% { transform: translateX(1020px); opacity: 0; } 100% { transform: translateX(1020px); opacity: 0; } }
    .dot { fill: #C4F446; opacity: .12; }
  </style>
  <defs><linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4F446"/><stop offset="1" stop-color="#A8D63C"/></linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>
  <rect x="0" y="12" width="880" height="2" rx="1" fill="url(#barGrad)" opacity=".85"/>
  <rect class="shine" x="0" y="10" width="120" height="6" rx="3" fill="url(#shineGrad)"/>
  <circle class="dot" cx="8" cy="13" r="2.5"/>
  <circle class="dot" cx="872" cy="13" r="2.5"/>
</svg>

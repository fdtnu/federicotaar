<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="170" viewBox="0 0 880 170">

  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .name { font-size: 33px; font-weight: 700; fill: #F4F1E9; }
    .desc { font-size: 16.5px; fill: #A7AEBB; }
    .pill { font-size: 13px; font-weight: 600; fill: #C4F446; letter-spacing: 1.5px; }
    .repo { font-size: 13px; fill: #6B7280; }
    .shine { animation: sweep 7s ease-in-out infinite; opacity: 0; }
    @keyframes sweep { 0% { transform: translateX(-160px); opacity: 0; } 8% { opacity: .5; } 26% { transform: translateX(1040px); opacity: 0; } 100% { transform: translateX(1040px); opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#C4F446" opacity="0.05"/></pattern>
    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="170" rx="16"/></clipPath>
  </defs>
  <rect width="880" height="170" rx="16" fill="#111316"/>
  <rect width="880" height="170" fill="url(#dots)"/>
  <g clip-path="url(#card)"><rect class="shine" style="animation-delay:4.4s" x="0" y="-20" width="140" height="210" fill="url(#shineg)" transform="skewX(-18)"/></g>
  <image x="28" y="43" width="96" height="96" xlink:href="data:image/png;base64,"/>
  <text class="t name" x="140" y="70">ATLAS</text>
  <text class="t desc" x="140" y="102">Personal intelligence system: memory with verifiable</text>
  <text class="t desc" x="140" y="126">sources, agents and predictions - local, zero cost</text>
  <rect x="696" y="26" width="160" height="30" rx="15" fill="none" stroke="#C4F446" stroke-opacity="0.55"/>
  <text class="t pill" x="776" y="46" text-anchor="middle">IN DEVELOPMENT</text>
  <text class="t repo" x="852" y="146" text-anchor="end">federicotaar/atlas</text>
</svg>

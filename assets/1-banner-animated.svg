<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="400" viewBox="0 0 1600 400">
  <style>
    .bg { fill: #111316; }
    .grid { animation: pan 16s linear infinite; }
    @keyframes pan { from { transform: translate(0,0); } to { transform: translate(48px,48px); } }
    .orb1 { animation: orbA 24s ease-in-out infinite; }
    .orb2 { animation: orbB 31s ease-in-out infinite; }
    @keyframes orbA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-160px,60px); } }
    @keyframes orbB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(190px,-70px); } }
    .p { fill: #C4F446; animation: rise 12s linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: .45; } 75% { opacity: .25; } 100% { transform: translateY(-480px); opacity: 0; } }
    .logo { animation: logoIn .35s ease-out both, logoGlow 4.5s ease-in-out .6s infinite; transform-origin: 236px 192px; }
    @keyframes logoIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes logoGlow { 0%,100% { filter: drop-shadow(0 0 6px rgba(200,240,74,.12)); } 50% { filter: drop-shadow(0 0 22px rgba(200,240,74,.34)); } }
    .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 76px; font-weight: 700; fill: #F4F1E9; animation: fadeUp .35s ease-out .05s both; }
    .tag { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 40px; font-weight: 400; fill: #BCEA44; }
    .sub { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 29px; font-weight: 400; fill: #969AA0; animation: fadeUp .4s ease-out .15s both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .mask { fill: #111316; animation: reveal 2s linear .6s both, maskFade .5s ease 2.9s both; }
    @keyframes reveal { from { transform: translateX(0); } to { transform: translateX(584px); } }
    @keyframes maskFade { to { opacity: 0; } }
    .cursor { fill: #C4F446; opacity: 0; animation: cursorMove 2s linear .6s both, cursorShow 0s .6s both, blink .8s step-end 2.7s infinite, cursorHide .5s ease 7.5s both; }
    @keyframes cursorMove { from { transform: translateX(0); } to { transform: translateX(584px); } }
    @keyframes cursorShow { to { opacity: 1; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes cursorHide { to { opacity: 0; } }
    .shine { animation: sweep 7s ease-in-out 2.2s infinite; opacity: 0; }
    @keyframes sweep { 0% { transform: translateX(-160px); opacity: 0; } 8% { opacity: .55; } 22% { transform: translateX(1700px); opacity: 0; } 100% { transform: translateX(1700px); opacity: 0; } }
  </style>
  <rect class="bg" width="1600" height="400"/>
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#C4F446" opacity="0.055"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C4F446" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#C4F446" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4F446"/>
      <stop offset="1" stop-color="#A8D63C"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="grid" x="-48" y="-48" width="1696" height="496" fill="url(#dots)"/>
  <ellipse class="orb1" cx="1300" cy="70" rx="440" ry="210" fill="url(#glow)"/>
  <ellipse class="orb2" cx="260" cy="360" rx="400" ry="190" fill="url(#glow)"/>
  <circle class="p" cx="240"  cy="430" r="2.2" style="animation-delay:-2.5s; animation-duration:11s"/>
  <circle class="p" cx="520"  cy="445" r="1.8" style="animation-delay:-7s;   animation-duration:13s"/>
  <circle class="p" cx="760"  cy="425" r="2.6" style="animation-delay:-4.2s; animation-duration:10s"/>
  <circle class="p" cx="980"  cy="440" r="1.7" style="animation-delay:-9.5s; animation-duration:14s"/>
  <circle class="p" cx="1180" cy="428" r="2.3" style="animation-delay:-1.2s; animation-duration:12s"/>
  <circle class="p" cx="1380" cy="442" r="1.9" style="animation-delay:-6s;   animation-duration:11.5s"/>
  <circle class="p" cx="1520" cy="435" r="2.4" style="animation-delay:-8.3s; animation-duration:13.5s"/>
  <image class="logo" x="114" y="70" width="244" height="244" xlink:href="data:image/png;base64,"/>
  <text class="name" x="415" y="196">Federico Taranu</text>
  <text class="tag" x="415" y="252">iOS, game and desktop software</text>
  <rect class="mask" x="415" y="212" width="660" height="56"/>
  <rect class="cursor" x="417" y="218" width="4" height="44" rx="2"/>
  <text class="sub" x="415" y="302">Fredrich Labs  |  Swift, Cloudflare, Python</text>
  <rect x="0" y="392" width="1600" height="8" fill="url(#barGrad)"/>
  <rect class="shine" x="0" y="392" width="140" height="8" fill="url(#shineGrad)"/>
</svg>

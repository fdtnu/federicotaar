<svg xmlns="http://www.w3.org/2000/svg" width="880" height="88" viewBox="0 0 880 88">
  
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .kick { font-size: 16px; font-weight: 600; fill: #BCEA44; letter-spacing: 3px; }
    .title { font-size: 36px; font-weight: 700; fill: #F4F1E9; }
    .grid { animation: pan 16s linear infinite; }
    @keyframes pan { from { transform: translate(0,0); } to { transform: translate(48px,48px); } }
    .shine { animation: sweep 5.5s ease-in-out infinite; opacity: 0; }
    @keyframes sweep { 0% { transform: translateX(-140px); opacity: 0; } 10% { opacity: .8; } 30% { transform: translateX(1020px); opacity: 0; } 100% { transform: translateX(1020px); opacity: 0; } }
    .dot { fill: #C4F446; opacity: .12; }
  </style>
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#C4F446" opacity="0.06"/></pattern></defs>
  <rect width="880" height="88" rx="16" fill="#111316"/>
  <rect class="grid" x="-48" y="-48" width="976" height="184" fill="url(#dots)"/>
  <rect x="28" y="26" width="6" height="36" rx="3" fill="#C4F446"/>
  <text class="t kick" x="53" y="32">01 / SELECTED</text>
  <text class="t title" x="52" y="68">Selected work</text>
</svg>
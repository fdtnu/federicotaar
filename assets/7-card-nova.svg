<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170">

  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .name { font-size: 33px; font-weight: 700; fill: #F4F1E9; }
    .desc { font-size: 16.5px; fill: #A7AEBB; }
    .pill { font-size: 13px; font-weight: 600; fill: #C4F446; letter-spacing: 1.5px; }
    .repo { font-size: 13px; fill: #6B7280; }
    .shine { animation: sweep 7s ease-in-out infinite; opacity: 0; }
    @keyframes sweep { 0% { transform: translateX(-160px); opacity: 0; } 8% { opacity: .5; } 26% { transform: translateX(1040px); opacity: 0; } 100% { transform: translateX(1040px); opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#C4F446" opacity="0.05"/></pattern>
    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="880" height="170" rx="16"/></clipPath>
  </defs>
  <rect width="880" height="170" rx="16" fill="#111316"/>
  <rect width="880" height="170" fill="url(#dots)"/>
  <g clip-path="url(#card)"><rect class="shine" style="animation-delay:0s" x="0" y="-20" width="140" height="210" fill="url(#shineg)" transform="skewX(-18)"/></g>
  <g transform="translate(28,43) scale(0.8750)"><path fill="#000000" d="M7,7 L0,19 L0,78 L7,90 L16,95 L81,95 L90,90 L95,81 L95,16 L90,7 L78,0 L19,0 Z"/><path fill="#000000" d="M29,25 L40,25 L57,51 L57,27 L59,25 L68,25 L70,27 L70,70 L68,72 L57,72 L40,46 L40,70 L38,72 L29,72 L27,70 L27,27 Z"/><path fill="#FEFEFE" d="M29,27 L29,70 L38,70 L39,43 L57,70 L68,70 L68,27 L59,27 L58,54 L40,27 Z"/></g>
  <text class="t name" x="140" y="70">NOVA</text>
  <text class="t desc" x="140" y="102">iPhone + Android school dashboard: homework, tests,</text>
  <text class="t desc" x="140" y="126">grades, timetable, widgets and an AI study assistant</text>
  <rect x="749" y="26" width="107" height="30" rx="15" fill="none" stroke="#C4F446" stroke-opacity="0.55"/>
  <text class="t pill" x="802" y="46" text-anchor="middle">COMPLETED</text>
  <text class="t repo" x="852" y="146" text-anchor="end">federicotaar/NOVA-ios &#8599;</text>
</svg>